<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reflexive Interview Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
/* Layout: field-notebook app. Sticky top bar carries the tape-label (interview code) and part tabs;
   a left index lists every page with progress; the page column holds one part at a time. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#18262a; --muted:#566a6c;
  --line:#d3dcda; --accent:#1d5f74; --accent-soft:#dcebef; --rec:#b23a3a; --ok:#2f7a4f;
  --font-display:"Literata",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1c; --surface:#182326; --surface-2:#1d2a2d; --ink:#e3ecea; --muted:#9ab0b0;
  --line:#2c3c3f; --accent:#7cc0d4; --accent-soft:#1f3a42; --rec:#e07a7a; --ok:#77c495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1c; --surface:#182326; --surface-2:#1d2a2d; --ink:#e3ecea; --muted:#9ab0b0;
  --line:#2c3c3f; --accent:#7cc0d4; --accent-soft:#1f3a42; --rec:#e07a7a; --ok:#77c495; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.25;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;max-width:1240px;margin:0 auto}
.brand-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin-right:auto}
.tape{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface-2)}
.tape .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);flex:none}
.tape label{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tape input{border:0;background:transparent;font-family:var(--font-mono);font-size:.9rem;width:9.5rem;min-width:0;padding:2px 0}
.tape input[type=date]{width:8.6rem}
.status{font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;font-weight:500;font-size:.92rem}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .letter{font-family:var(--font-mono);font-size:.8rem;margin-right:6px}

/* Shell */
.shell{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
.side{position:sticky;top:120px;align-self:start}
.side h2{font-family:var(--font-body);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side a{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:6px;font-size:.92rem}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .sub a{padding-left:28px;font-size:.88rem}
.side .count{margin-left:auto;font-family:var(--font-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side .group{font-size:.92rem;padding:10px 10px 2px;color:var(--muted)}
.privacy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:.86rem}
.privacy h2{font-family:var(--font-display);font-size:.98rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin:0 0 6px}
.privacy p{margin:6px 0 0;color:var(--muted)}
.privacy a{color:var(--accent)}
.privacy-side{margin-top:22px}
.privacy-mobile{display:none;margin-top:30px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.privacy-mobile{display:block}}

/* Page */
main{min-width:0;max-width:760px}
.eyebrow{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.page-title{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:700}
.lead{color:var(--muted);margin:10px 0 0;max-width:62ch}
.block{margin-top:30px}
.block h3{font-size:1.15rem;font-weight:600;margin-bottom:4px}
.guide{color:var(--muted);font-style:italic;font-size:.92rem;margin:4px 0 12px;max-width:62ch}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.prompt{margin-top:16px}
.prompt label{display:block;font-weight:600;margin-bottom:6px}
.prompt .num{font-family:var(--font-mono);color:var(--accent);font-weight:500;margin-right:8px}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.static{margin:8px 0 0;padding-left:1.2rem;display:grid;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.cue{border-left:4px solid var(--accent)}
.rating{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rating .q{flex:1 1 260px;min-width:0}
.scale{display:flex;gap:4px;align-items:center}
.scale small{font-size:.75rem;color:var(--muted)}
.scale button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.jot-wrap{overflow-x:auto;margin-top:10px}
table.jot{border-collapse:collapse;width:100%;min-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.jot th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.jot td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.jot input{width:100%;border:0;background:transparent;padding:6px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.jot td.note input{font-family:var(--font-body)}
.jot td.x{width:40px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--rec)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--accent);font-weight:500}
.notice{margin-top:12px;padding:10px 14px;border-radius:6px;background:var(--accent-soft);font-size:.92rem}
.notice.err{background:color-mix(in srgb,var(--rec) 14%,var(--surface));}
.prose p{margin:12px 0 0;max-width:64ch}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.steps .when{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;grid-column:1/-1}
.steps b{font-weight:600}
.steps a{color:var(--accent)}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--rec);border-radius:6px;background:var(--surface)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <span class="brand">Reflexive Interview Companion</span>
      <div class="tape" title="Interview code. Use a code, never the participant's real name.">
        <span class="dot" aria-hidden="true"></span>
        <label for="code">Interview</label>
        <input id="code" placeholder="e.g. Teacher 1" autocomplete="off">
      </div>
      <div class="tape">
        <label for="idate">Date</label>
        <input id="idate" type="date">
      </div>
      <span class="status" id="status"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Parts"></nav>
  </div>
</header>

<div class="shell">
  <aside class="side" aria-label="All pages">
    <h2>Contents</h2>
    <ol id="sidenav"></ol>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------- Instrument content ---------- */
const PAGES = [
  {id:"about", label:"About this tool", tab:"about"},
  {id:"part-a", tab:"part-a", letter:"A", label:"Preparation checklist", eyebrow:"Part A · Before the interview day",
   lead:"Work through this list in the days before the interview. Everything here should be ready before you meet the participant.",
   blocks:[
    {type:"checks", heading:"Ethics and consent", items:[
      "Ethics approval reference to hand; using the approved version of the protocol",
      "Participant information sheet and consent form (two copies: one for you, one for the participant)",
      "Consent to audio recording covered explicitly on the form",
      "Distress or referral information ready, if the topic could be sensitive"]},
    {type:"checks", heading:"Logistics", items:[
      "Time and place confirmed with the participant in writing",
      "Venue is quiet and private (or for online interviews: link sent, platform recording tested, participant knows how to join)",
      "Supervisor or a colleague knows where and when the interview takes place",
      "Extra time allowed before and after, so you're not rushing"]},
    {type:"checks", heading:"Equipment", items:[
      "Two recording devices, both tested in the actual room",
      "Devices charged, spare batteries or charger, enough storage space",
      "Phone on airplane or do-not-disturb mode",
      "Printed interview guide with probes, plus the cue card",
      "Notebook and pens; demographic sheet if one is used"]},
    {type:"checks", heading:"Identification", items:[
      "Participant ID or pseudonym assigned (e.g., P03)",
      "Participant log updated"]},
    {type:"checks", heading:"Readiness", items:[
      "Interview guide practised aloud at least once (a pilot with a peer is ideal)",
      "Phase 1 reflection completed"]}
   ]},
  {id:"phase-1", tab:"part-b", letter:"B", group:"B", label:"Phase 1 · Before", eyebrow:"Part B · Reflexive tool · Phase 1",
   title:"Before the interview",
   lead:"Write a few honest lines for each prompt. There are no right answers; the point is to have something to compare against afterwards.",
   blocks:[{type:"prompts", items:[
      "What do I hope to learn from this person?",
      "What do I expect them to say? Is there an answer I'm hoping for?",
      "How might this person see me (age, role, university, insider or outsider)? How might that affect what they tell me?",
      "Is there anything that might make it hard for them to disagree with me or refuse to answer?",
      "Which question am I most nervous about asking? Why?",
      "Which of my questions might push them towards a particular answer? Can I rephrase it?",
      "In which language(s) will we speak? Is anything likely to be lost?",
      "How am I feeling today? Is anything likely to distract me?"]}]},
  {id:"phase-2", tab:"part-b", letter:"B", group:"B", label:"Phase 2 · During", eyebrow:"Part B · Reflexive tool · Phase 2",
   title:"During the interview",
   lead:"Keep this page or the printed cue card beside you. Don't try to reflect in depth while interviewing; glance at the prompts now and then, and jot a word or a time when something happens.",
   blocks:[
    {type:"checks", heading:"Before you start", items:[
      "Both recorders running and showing the timer",
      "Consent form signed; ask again on tape: \"Are you happy for me to record?\"",
      "Say the participant ID and date aloud on the recording",
      "Remind them they can skip a question, pause or stop at any time",
      "Phone silenced"]},
    {type:"list", cue:true, heading:"Check in with yourself", items:[
      "Am I listening, or just waiting to ask my next question?",
      "Am I following their story, or pulling them back to my list?",
      "Did I just agree, judge, or finish their sentence?",
      "Can I wait a few more seconds in this silence?",
      "Did they avoid or rush past something?"]},
    {type:"list", heading:"Neutral follow-ups", intro:"Use these to go deeper without suggesting an answer.", items:[
      "Can you tell me more about that?",
      "Can you give me an example?",
      "What happened next?",
      "What do you mean by \"…\"? (use their exact word)",
      "How did you feel about that?",
      "You mentioned … earlier. Could we go back to that?",
      "Or simply: nod, wait, and say nothing."]},
    {type:"jots", heading:"Jot down", intro:"Moments of surprise, discomfort, a change in mood or rapport, notable non-verbal cues. A word and a rough time is enough."},
    {type:"checks", heading:"Closing", items:[
      "\"Is there anything else you'd like to add?\"",
      "\"Is there anything I should have asked but didn't?\"",
      "Thanked them and explained what happens next with their interview",
      "Checked both recorders before stopping them",
      "Noted anything said after the recording stopped (not used as data without their permission)",
      "End time noted"]}
   ]},
  {id:"phase-3a", tab:"part-b", letter:"B", group:"B", label:"Phase 3a · Same day", eyebrow:"Part B · Reflexive tool · Phase 3a",
   title:"Immediately after the interview",
   lead:"Do this on the same day, before listening to the recording. Memory fades fast, and first impressions are data too.",
   blocks:[{type:"prompts", items:[
      "What stood out most?",
      "What surprised me, compared with what I expected in Phase 1?",
      "When did I feel comfortable or uncomfortable? What was happening then?",
      "Where did I leave my interview guide, and why?",
      "How do I think I influenced what was said?",
      "What am I already tempted to conclude? Is it too early?",
      "Is anything ethically unresolved, such as something they may regret saying or something I promised?"]}]},
  {id:"phase-3b", tab:"part-b", letter:"B", group:"B", label:"Phase 3b · With recording", eyebrow:"Part B · Reflexive tool · Phase 3b",
   title:"Later, with the recording or transcript",
   lead:"Be curious rather than self-critical. Every interviewer misses things.",
   blocks:[
    {type:"prompts", items:[
      "Roughly how much of the talking did I do?",
      "Where did I interrupt or change the subject?",
      "Which of my follow-up questions opened things up? Which closed them down?",
      "Where did the participant offer something I didn't follow up?",
      "Do my notes from the day match what the recording shows?",
      "Would the participant recognise themselves in how I'm describing them?",
      "What will I do differently next time?"]},
    {type:"ratings", heading:"Self-rating", intro:"1 = very little, 5 = a great deal. Compare these across interviews.", items:[
      "How much did I steer the conversation?",
      "How comfortable was I with silence?",
      "How well did I follow up on the participant's own points?"]},
    {type:"prompts", heading:"Carry forward", intro:"One or two things to focus on in the next interview. Read these again before your next Phase 1.", start:8, items:[
      "What will I focus on next time?"]}
   ]},
  {id:"part-c", tab:"part-c", letter:"C", label:"Data management", eyebrow:"Part C · After the interview",
   lead:"Tick these off as you go. The same-day items protect the recording; the rest prepare it for analysis.",
   blocks:[
    {type:"checks", heading:"Same day", items:[
      "Recording stopped, file saved, and checked that it plays",
      "Audio transferred to secure, institution-approved storage",
      "Second backup copy made on approved storage",
      "Files named consistently (e.g., P03_2026-10-20_audio)",
      "Recording deleted from the device, if the data management plan requires it",
      "Signed consent form stored separately from the data",
      "Key linking names to IDs stored separately and securely",
      "Field notes and Phase 3a reflection saved under the same ID",
      "Participant log updated"]},
    {type:"checks", heading:"Within a week: transcription", items:[
      "Transcript checked against the audio in a full second listen",
      "Transcript pseudonymised: names, places, institutions, other identifying details",
      "Final version saved and clearly labelled; working versions kept or deleted as the plan requires",
      "Transcript sent to the participant for checking, if the protocol includes this",
      "Phase 3b reflection completed"]},
    {type:"checks", heading:"First-pass coding", items:[
      "Whole transcript read once without coding",
      "Short memo written on overall impressions",
      "Initial codes noted in the margin, staying close to the participant's words",
      "New codes added to a codebook with a short definition and one example",
      "Passages where your own influence is visible flagged, linking back to the reflexive notes",
      "Codes and memo discussed with your supervisor before moving to the next interview"]}
   ]},
  {id:"export", tab:"export", label:"Save & export"}
];
const TABS = [
  {tab:"about", label:"About", href:"about"},
  {tab:"part-a", letter:"A", label:"Preparation", href:"part-a"},
  {tab:"part-b", letter:"B", label:"Reflexive tool", href:"phase-1"},
  {tab:"part-c", letter:"C", label:"Data management", href:"part-c"},
  {tab:"export", label:"Save & export", href:"export"}
];
const PAGE_TITLES = {"part-a":"Preparation checklist","part-c":"Data management"};

/* ---------- State ---------- */
const STORE_KEY = "ric-draft-v1";
const blank = () => ({code:"", date:"", checks:{}, text:{}, ratings:{}, jots:[{t:"",note:""},{t:"",note:""},{t:"",note:""}]});
let S = blank();
let storageOK = true;
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); }
catch(e){ storageOK = false; }

let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
    catch(e){ storageOK = false; }
    renderStatus(); renderSide();
  }, 300);
}
function renderStatus(){
  const el = document.getElementById("status");
  el.textContent = storageOK ? "Kept in this browser only" : "Not kept after closing: export to save your work";
}

/* ---------- Helpers ---------- */
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k,"");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k == null) continue; el.append(k.nodeType ? k : document.createTextNode(k)); }
  return el;
}
const iid = (p,b,i) => `${p}.${b}.${i}`;
function pageProgress(p){
  if (!p.blocks) return null;
  let done=0,total=0;
  p.blocks.forEach((b,bi)=>{
    if (b.type==="checks"){ b.items.forEach((_,i)=>{ total++; if (S.checks[iid(p.id,bi,i)]) done++; }); }
    if (b.type==="prompts"){ b.items.forEach((_,i)=>{ total++; if ((S.text[iid(p.id,bi,i)]||"").trim()) done++; }); }
    if (b.type==="ratings"){ b.items.forEach((_,i)=>{ total++; if (S.ratings[iid(p.id,bi,i)]) done++; }); }
  });
  return total ? `${done}/${total}` : null;
}
const titleOf = p => p.title || PAGE_TITLES[p.id] || p.label;

/* ---------- Navigation ---------- */
function current(){ const id = location.hash.slice(1); return PAGES.find(p=>p.id===id) || PAGES[0]; }
function renderTabs(){
  const cur = current();
  const nav = document.getElementById("tabs"); nav.replaceChildren();
  TABS.forEach(t => nav.append(h("a",{href:"#"+t.href,"aria-current":String(cur.tab===t.tab)},
    t.letter ? h("span",{class:"letter"},t.letter) : null, t.label)));
}
function renderSide(){
  const cur = current();
  const ol = document.getElementById("sidenav"); ol.replaceChildren();
  let groupShown = false;
  PAGES.forEach(p=>{
    if (p.group==="B" && !groupShown){ ol.append(h("li",{class:"group"},"B · Reflexive tool")); groupShown = true; }
    const prog = pageProgress(p);
    const label = p.group ? p.label : (p.letter ? `${p.letter} · ${p.label}` : p.label);
    ol.append(h("li",{class:p.group?"sub":""}, h("a",{href:"#"+p.id,"aria-current":String(p.id===cur.id)},
      h("span",{},label), prog ? h("span",{class:"count"},prog) : null)));
  });
}

/* ---------- Page renderers ---------- */
function renderBlock(p, b, bi){
  const wrap = h("section",{class:"block"});
  if (b.heading) wrap.append(h("h3",{},b.heading));
  if (b.intro) wrap.append(h("p",{class:"guide"},b.intro));
  if (b.type==="checks"){
    const ul = h("ul",{class:"checks"});
    b.items.forEach((t,i)=>{
      const id = iid(p.id,bi,i);
      const cb = h("input",{type:"checkbox",id:"c-"+id});
      cb.checked = !!S.checks[id];
      cb.addEventListener("change",()=>{ S.checks[id]=cb.checked; persist(); });
      ul.append(h("li",{},h("label",{for:"c-"+id},cb,h("span",{},t))));
    });
    wrap.append(ul);
  }
  if (b.type==="prompts"){
    b.items.forEach((q,i)=>{
      const id = iid(p.id,bi,i);
      const ta = h("textarea",{id:"t-"+id,rows:"3"});
      ta.value = S.text[id]||"";
      ta.addEventListener("input",()=>{ S.text[id]=ta.value; persist(); });
      wrap.append(h("div",{class:"prompt"},
        h("label",{for:"t-"+id}, b.items.length>1 || !b.heading ? h("span",{class:"num"},String((b.start||1)+i).padStart(2,"0")) : null, q), ta));
    });
  }
  if (b.type==="list"){
    const box = h("div",{class:"card"+(b.cue?" cue":"")});
    box.append(h("ul",{class:"static"}, b.items.map(t=>h("li",{},t))));
    wrap.append(box);
  }
  if (b.type==="ratings"){
    b.items.forEach((q,i)=>{
      const id = iid(p.id,bi,i);
      const scale = h("div",{class:"scale",role:"group","aria-label":q}, h("small",{},"1"));
      for (let n=1;n<=5;n++){
        const btn = h("button",{type:"button","aria-pressed":String(S.ratings[id]===n),id:`r-${id}-${n}`},String(n));
        btn.addEventListener("click",()=>{
          S.ratings[id] = S.ratings[id]===n ? 0 : n; persist();
          scale.querySelectorAll("button").forEach((x,k)=>x.setAttribute("aria-pressed",String(S.ratings[id]===k+1)));
        });
        scale.append(btn);
      }
      scale.append(h("small",{},"5"));
      wrap.append(h("div",{class:"rating"},h("span",{class:"q"},q),scale));
    });
  }
  if (b.type==="jots"){
    const tbody = h("tbody");
    const draw = () => {
      tbody.replaceChildren();
      S.jots.forEach((j,i)=>{
        const t = h("input",{id:`jt-${i}`,placeholder:"mm:ss","aria-label":`Time, row ${i+1}`});
        t.value = j.t; t.addEventListener("input",()=>{ j.t=t.value; persist(); });
        const n = h("input",{id:`jn-${i}`,placeholder:"What happened","aria-label":`Note, row ${i+1}`});
        n.value = j.note; n.addEventListener("input",()=>{ j.note=n.value; persist(); });
        const del = h("button",{type:"button",class:"btn ghost","aria-label":`Remove row ${i+1}`,onclick:()=>{ S.jots.splice(i,1); persist(); draw(); }},"×");
        tbody.append(h("tr",{},h("td",{style:"width:90px"},t),h("td",{class:"note"},n),h("td",{class:"x"},del)));
      });
    };
    draw();
    wrap.append(h("div",{class:"jot-wrap"},h("table",{class:"jot"},
      h("thead",{},h("tr",{},h("th",{},"Time"),h("th",{},"What happened"),h("th",{},""))), tbody)));
    wrap.append(h("div",{class:"row"},h("button",{type:"button",class:"btn",onclick:()=>{ S.jots.push({t:"",note:""}); persist(); draw(); tbody.querySelector("tr:last-child input")?.focus(); }},"Add a row")));
  }
  return wrap;
}

function privacyPanel(cls){
  return h("section",{class:"privacy "+cls,"aria-label":"Your data stays with you"},
    h("h2",{},"Your data stays with you"),
    h("p",{},"Nothing is sent or stored online. Your answers are kept only in this browser on this device."),
    h("p",{},"Use a code such as Teacher 1, never the participant's real name."),
    h("p",{},"To keep a copy, move to another device or share with your supervisor, go to ",h("a",{href:"#export"},"Save & export"),"."));
}
function renderInstrument(p, main){
  main.append(h("div",{class:"eyebrow"},p.eyebrow), h("h1",{class:"page-title"},titleOf(p)), h("p",{class:"lead"},p.lead));
  p.blocks.forEach((b,bi)=>main.append(renderBlock(p,b,bi)));
}

function renderAbout(main){
  main.append(
    h("div",{class:"eyebrow"},"Interview training"),
    h("h1",{class:"page-title"},"What this tool is for"),
    h("div",{class:"prose"},
      h("p",{},"This companion supports you through one research interview, from preparation to first-pass coding. It combines practical checklists with a reflexive tool: a set of questions that help you notice how your expectations, your position and your choices in the conversation shape what the participant tells you."),
      h("p",{},"Reflexivity is not about judging yourself. It is about keeping a record you can learn from. The questions before the interview are paired with questions afterwards, so you can compare what you expected with what actually happened.")),
    h("section",{class:"block"},h("h3",{},"How to use it"),
      h("ol",{class:"steps"},
        step("Days before","Part A · Preparation checklist","Get ethics, logistics and equipment in order.","part-a"),
        step("Before you meet","Phase 1 · Before","Write down your expectations and concerns.","phase-1"),
        step("During","Phase 2 · During","Glance at the cue card and jot down key moments.","phase-2"),
        step("Same day","Phase 3a · Same day","Record first impressions before listening to the recording.","phase-3a"),
        step("Same day onwards","Part C · Data management","Back up, store and transcribe the recording securely.","part-c"),
        step("Within a week","Phase 3b · With recording","Review your interviewing against the recording, then start coding.","phase-3b"))),
    privacyPanel("privacy-mobile")
  );
  function step(when,title,desc,href){ return h("li",{},h("span",{class:"when"},when),h("div",{},h("b",{},h("a",{href:"#"+href},title))," ",desc)); }
}

/* ---------- Export / import ---------- */
const downloadsNS = true; /* standalone: ordinary browser downloads */
function renderIfExport(){ if (current().id==="export") render(); }
function fileStem(){
  const c = (S.code||"interview").trim().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"") || "interview";
  return `${c}_reflexive-record`;
}
function exportJSON(){ return JSON.stringify({tool:"reflexive-interview-companion",version:1,exported:new Date().toISOString(),data:S},null,2); }
function loadJSON(text){
  const obj = JSON.parse(text);
  const d = obj && obj.tool==="reflexive-interview-companion" ? obj.data : null;
  if (!d || typeof d!=="object") throw new Error("This file wasn't exported from this tool.");
  S = Object.assign(blank(), d);
  if (!Array.isArray(S.jots)) S.jots = blank().jots;
  persist();
}
function msg(el, text, err){ el.replaceChildren(h("div",{class:"notice"+(err?" err":"")},text)); }
async function save(filename, data, out){
  try {
    const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".json") ? "application/json" : "application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    msg(out, `Downloaded ${filename}.`);
  } catch(e){ msg(out, "The file couldn't be downloaded. Try again, or use Copy as text instead.", true); }
}
function buildDocx(){
  const D = window.docx; if (!D) throw new Error("nolib");
  const {Document,Packer,Paragraph,TextRun,HeadingLevel,Table,TableRow,TableCell,WidthType} = D;
  const kids = [];
  const P = (text,opts={}) => new Paragraph({children:[new TextRun({text,...opts})],spacing:{after:120}});
  kids.push(new Paragraph({text:"Reflexive Interview Companion",heading:HeadingLevel.TITLE}));
  kids.push(P(`Interview: ${S.code||"(no code)"}`,{bold:true}));
  kids.push(P(`Date: ${S.date||"(not set)"}`));
  kids.push(P(`Exported: ${new Date().toLocaleDateString()}`,{color:"666666"}));
  PAGES.filter(p=>p.blocks).forEach(p=>{
    kids.push(new Paragraph({text:p.eyebrow,heading:HeadingLevel.HEADING_1}));
    if (p.title) kids.push(new Paragraph({text:p.title,heading:HeadingLevel.HEADING_2}));
    p.blocks.forEach((b,bi)=>{
      if (b.heading) kids.push(new Paragraph({text:b.heading,heading:HeadingLevel.HEADING_3}));
      if (b.type==="checks") b.items.forEach((t,i)=>kids.push(P(`${S.checks[iid(p.id,bi,i)]?"☑":"☐"}  ${t}`)));
      if (b.type==="list") b.items.forEach(t=>kids.push(new Paragraph({text:t,bullet:{level:0}})));
      if (b.type==="prompts") b.items.forEach((q,i)=>{
        kids.push(new Paragraph({children:[new TextRun({text:q,bold:true})],spacing:{before:160,after:60}}));
        const ans = (S.text[iid(p.id,bi,i)]||"").trim();
        (ans ? ans.split(/\n/) : ["—"]).forEach(line=>kids.push(P(line, ans?{}:{color:"999999"})));
      });
      if (b.type==="ratings") b.items.forEach((q,i)=>{ const v=S.ratings[iid(p.id,bi,i)]; kids.push(P(`${q}  ${v?v+" / 5":"not rated"}`)); });
      if (b.type==="jots"){
        const rows = S.jots.filter(j=>j.t||j.note);
        if (!rows.length) kids.push(P("No notes.",{color:"999999"}));
        else kids.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
          new TableRow({children:["Time","What happened"].map(x=>new TableCell({children:[new Paragraph({children:[new TextRun({text:x,bold:true})]})]}))}),
          ...rows.map(j=>new TableRow({children:[new TableCell({width:{size:15,type:WidthType.PERCENTAGE},children:[new Paragraph(j.t||"")]}),new TableCell({children:[new Paragraph(j.note||"")]})]}))]}));
      }
    });
  });
  return Packer.toBlob(new Document({creator:"Reflexive Interview Companion",title:`Reflexive record ${S.code}`,sections:[{children:kids}]}));
}

function renderExport(main){
  const out = h("div",{});
  const noDl = downloadsNS === null || downloadsNS === undefined;
  main.append(h("div",{class:"eyebrow"},"Your record"), h("h1",{class:"page-title"},"Save & export"),
    h("p",{class:"lead"},"Your answers live only in this browser. Download a copy to keep it safe, move it to another device, or share it with your supervisor."));

  main.append(h("section",{class:"block"},h("h3",{},"Save as a Word document"),
    h("p",{class:"guide"},"A readable copy of all parts, with your answers and ticks, for your records or your supervisor."),
    h("div",{class:"row"},h("button",{type:"button",class:"btn primary",disabled:noDl,onclick:async()=>{
      try { const blob = await buildDocx(); await save(fileStem()+".docx", blob, out); }
      catch(e){ msg(out,"The Word document couldn't be created. Reload the page and try again.",true); }
    }},"Download Word document"))));

  main.append(h("section",{class:"block"},h("h3",{},"Export your data"),
    h("p",{class:"guide"},"A data file you can load back into this tool later, on this or another device."),
    h("div",{class:"row"},h("button",{type:"button",class:"btn",disabled:noDl,onclick:()=>save(fileStem()+".json", exportJSON(), out)},"Download data file"),
      h("button",{type:"button",class:"btn",onclick:async(ev)=>{
        const txt = exportJSON();
        try { await navigator.clipboard.writeText(txt); msg(out,"Copied. Paste it into a text file and save it somewhere safe."); }
        catch(e){ const ta = h("textarea",{id:"copybox",rows:"8",readonly:true}); ta.value = txt; out.replaceChildren(h("p",{class:"guide"},"Select all of this text and copy it:"),ta); ta.select(); }
      }},"Copy as text"))));

  main.append(out);
  if (noDl) out.append(h("div",{class:"notice"},"Downloads aren't available in this view. Use Copy as text, or open the tool in claude.ai."));

  const fin = h("input",{type:"file",id:"importfile",accept:".json,application/json"});
  const pending = h("div",{});
  const ask = (text) => {
    pending.replaceChildren(h("div",{class:"confirm"},
      h("p",{style:"margin:0"},"This replaces everything currently in the tool with the uploaded record. Continue?"),
      h("div",{class:"row"},
        h("button",{type:"button",class:"btn primary",onclick:()=>{ try{ loadJSON(text); render(); location.hash="#about"; } catch(e){ msg(pending,e.message.startsWith("This")?e.message:"That file couldn't be read. Choose a data file exported from this tool.",true); } }},"Replace and load"),
        h("button",{type:"button",class:"btn",onclick:()=>{ pending.replaceChildren(); fin.value=""; }},"Cancel"))));
  };
  fin.addEventListener("change",()=>{ const f = fin.files[0]; if (!f) return; const r = new FileReader(); r.onload=()=>ask(String(r.result)); r.readAsText(f); });
  const paste = h("textarea",{id:"pastebox",rows:"5",placeholder:"Paste the exported text here"});
  main.append(h("section",{class:"block"},h("h3",{},"Load a saved record"),
    h("p",{class:"guide"},"Upload a data file you exported earlier to continue where you left off."),
    h("div",{class:"row"},fin),
    h("details",{},h("summary",{},"Or paste exported text"),paste,h("div",{class:"row"},h("button",{type:"button",class:"btn",onclick:()=>paste.value.trim()&&ask(paste.value)},"Load pasted text"))),
    pending));

  const clr = h("div",{});
  main.append(h("section",{class:"block"},h("h3",{},"Start a new interview"),
    h("p",{class:"guide"},"Clears all answers from this browser. Export first if you want to keep them."),
    h("div",{class:"row"},h("button",{type:"button",class:"btn danger",onclick:()=>{
      clr.replaceChildren(h("div",{class:"confirm"},h("p",{style:"margin:0"},"Delete all answers for this interview from this browser?"),
        h("div",{class:"row"},h("button",{type:"button",class:"btn danger",onclick:()=>{ S = blank(); persist(); render(); location.hash="#about"; }},"Delete answers"),
          h("button",{type:"button",class:"btn",onclick:()=>clr.replaceChildren()},"Cancel"))));
    }},"Clear and start new")), clr));
}

/* ---------- Render ---------- */
function render(){
  const p = current();
  const main = document.getElementById("main"); main.replaceChildren();
  if (p.id==="about") renderAbout(main);
  else if (p.id==="export") renderExport(main);
  else renderInstrument(p, main);
  const i = PAGES.indexOf(p), prev = PAGES[i-1], next = PAGES[i+1];
  main.append(h("nav",{class:"pager","aria-label":"Previous and next"},
    prev ? h("a",{href:"#"+prev.id},"← "+prev.label) : h("span"),
    next ? h("a",{href:"#"+next.id},next.label+" →") : h("span")));
  renderTabs(); renderSide(); renderStatus();
  document.getElementById("code").value = S.code;
  document.getElementById("idate").value = S.date;
}
document.getElementById("code").addEventListener("input",e=>{ S.code=e.target.value; persist(); });
document.getElementById("idate").addEventListener("change",e=>{ S.date=e.target.value; persist(); });
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
document.querySelector(".side").append(privacyPanel("privacy-side"));
render();
</script>
