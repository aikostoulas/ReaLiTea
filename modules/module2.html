<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 2: Locating relevant knowledge to inform language education — ReaLiTea self-study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  color-scheme: light;
  --ink:#1E2B38; --slate:#44596E; --steel:#6E8599; --mist:#DCE4EB; --fog:#EEF2F5; --paper:#FFFFFF; --page:#F5F7F9;
  --action:#2F5F8A; --action-dark:#234A6D; --focus:#E0A100;
  --explain:#5B7690; --worked:#2F5F8A; --branch:#8A6A2F; --voices:#6A5A8A; --resist:#8A3F3F; --expect:#4F7A6A; --options:#44596E;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  /* page theme (overridden per page below) */
  --mast:#1E2B38; --mast-soft:#C9D4DE; --mast-num:#6E8599; --tint:#EEF2F5;
}
/* one colour family per page; layout is shared */
body.theme-home{--mast:#1E2B38;--mast-soft:#C9D4DE;--mast-num:#7F95A9;--action:#2F5F8A;--action-dark:#234A6D;--tint:#EEF2F5;--worked:#2F5F8A}
body.theme-m1{--mast:#123F3D;--mast-soft:#BFDAD6;--mast-num:#5FA39B;--action:#1C6E68;--action-dark:#14524D;--tint:#EAF4F2;--worked:#1C6E68}
body.theme-m2{--mast:#3A2250;--mast-soft:#D9C9E8;--mast-num:#9A78BA;--action:#6A3E8E;--action-dark:#502E6C;--tint:#F3EEF8;--worked:#6A3E8E}
body.theme-m3{--mast:#16304F;--mast-soft:#C6D5E6;--mast-num:#6F93BA;--action:#2A5C8F;--action-dark:#1F466E;--tint:#EDF2F8;--worked:#2A5C8F}
body.theme-m4{--mast:#1F3B26;--mast-soft:#C8DDCB;--mast-num:#6FA07A;--action:#2F6B3C;--action-dark:#23522E;--tint:#EDF5EE;--worked:#2F6B3C}
body.theme-m5{--mast:#4A1C2C;--mast-soft:#EACBD5;--mast-num:#BE7189;--action:#8E3350;--action-dark:#6E263D;--tint:#F8EEF1;--worked:#8E3350}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
a{color:var(--action);text-underline-offset:2px;overflow-wrap:anywhere}
a:hover{color:var(--action-dark)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:0 0 .8em} ul,ol{margin:0 0 .9em;padding-left:1.35em} li{margin-bottom:.35em}
.small{font-size:.86rem;color:var(--slate)}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.15;margin:0}

/* masthead */
.masthead{background:var(--mast);color:#fff}
.mast-inner{max-width:1240px;margin:0 auto;padding:22px 24px 34px}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 26px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.18)}
.series{font-size:.95rem;color:var(--mast-soft);margin:0;max-width:46ch}
.brand{display:flex;align-items:center;gap:18px;margin-left:auto;text-decoration:none;color:#fff}
.brand-text{text-align:right;line-height:1.25}
.brand-text strong{display:block;font-family:var(--cond);font-weight:600;font-size:1.2rem;letter-spacing:.01em}
.brand-text span{display:block;font-size:.88rem;color:var(--mast-soft)}
.brand img{display:block;height:64px;width:auto}
a.brand:hover .brand-text strong{text-decoration:underline;text-underline-offset:3px}
.mast-title{display:flex;align-items:flex-end;gap:22px}
.mod-num{font-family:var(--cond);font-weight:700;font-size:clamp(5.5rem,14vw,9.5rem);line-height:.78;color:var(--mast-num)}
.mod-label{font-family:var(--cond);font-size:1.15rem;color:var(--mast-soft);margin:0 0 4px}
.masthead h1{font-size:clamp(2rem,4.6vw,3.3rem);max-width:22ch}
.mast-meta{margin:22px 0 0;color:var(--mast-soft);max-width:62ch}
@media (max-width:700px){
  .mast-top{flex-direction:column-reverse;align-items:flex-end}
  .series{align-self:flex-start}
  .brand img{height:48px}
}

/* layout */
.layout{max-width:1240px;margin:0 auto;padding:28px 24px 48px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px;align-items:start}
.side{align-self:stretch}
.side-sticky{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;margin-top:16px}
.main{max-width:820px}
@media (max-width:999px){ .layout{grid-template-columns:minmax(0,1fr);gap:20px;padding:16px 12px 40px} .side-sticky{position:static;max-height:none} }

/* my work panel */
.mywork{background:var(--paper);border:1px solid var(--mist);border-top:4px solid var(--action);padding:16px 16px 18px}
.mywork h2{font-size:1.5rem;margin-bottom:10px}
.status{font-size:.88rem;color:var(--slate);margin:6px 0 10px}
.status-warn{color:var(--resist);font-weight:600}
.inline-check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin:4px 0 12px}
.inline-check input{margin-top:5px}
.mywork .btn{width:100%;margin-top:8px}

.side>*+*{margin-top:16px}
.side-box{background:var(--paper);border:1px solid var(--mist);border-left:5px solid var(--c,var(--action));padding:14px 16px 12px;font-size:.93rem}
.side-box h2{font-size:1.25rem;margin:0 0 6px}
.side-box p{margin:0 0 .6em} .side-box ul{margin:0 0 .6em;padding-left:1.15em} .side-box li{margin-bottom:.25em}
.side-box.local{--c:var(--expect);background:var(--tint)}
.local-icon{display:inline-block;width:1.05em;height:1.05em;vertical-align:-2px;margin-right:6px}
.toc-wrap{margin-top:16px;background:var(--paper);border:1px solid var(--mist)}
.toc-wrap>summary{cursor:pointer;padding:10px 14px;font-family:var(--cond);font-size:1.2rem;font-weight:600}
.toc{padding:0 14px 12px;font-size:.93rem}
.toc a{text-decoration:none;color:var(--ink)} .toc a:hover{color:var(--action);text-decoration:underline}
.toc-a{display:block;font-weight:600;margin:10px 0 4px}
.toc ol{list-style:none;padding:0;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.toc li{margin:0} .toc li a{display:inline-flex;align-items:center;gap:6px;color:var(--slate)}
.dot{width:10px;height:10px;border:2px solid var(--steel);display:inline-block}
.dot.done{background:var(--expect);border-color:var(--expect)}

/* buttons & fields */
.btn{font:inherit;font-family:var(--cond);font-size:1.05rem;font-weight:600;letter-spacing:.01em;border:2px solid var(--action);background:var(--paper);color:var(--action);padding:7px 14px;cursor:pointer;border-radius:0;text-decoration:none;display:inline-block}
.btn:hover{background:var(--fog)}
.btn:disabled{opacity:.6;cursor:progress}
.btn-primary{background:var(--action);color:#fff} .btn-primary:hover{background:var(--action-dark);border-color:var(--action-dark)}
.btn-quiet{border-width:1px;font-size:.98rem;padding:5px 11px;margin-top:6px}
.btn-danger{border-color:var(--resist);color:var(--resist);border-width:1px;font-size:.98rem}
.btn-danger:hover{background:#F6ECEC}
.field{margin:14px 0}
.field-label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:#fff;border:1px solid var(--steel);border-radius:0;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:2.6em;line-height:1.45}
select{width:auto;max-width:100%;padding:6px 8px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--action)}
.counter{font-size:.85rem;color:var(--slate);margin-top:4px}
.warn{color:var(--resist);font-size:.9rem;margin:6px 0 0;min-height:1em}

/* overview & activities */
.overview,.activity{background:var(--paper);border:1px solid var(--mist);padding:26px 28px;margin-bottom:28px}
.overview>h2,.activity>h2{font-size:2.1rem;margin-bottom:14px}
.intro-h{font-size:1.4rem;margin:22px 0 8px;color:var(--slate)}
.act-no{display:block;font-size:1.05rem;color:var(--steel);font-weight:600;margin-bottom:2px}
.act-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 0 20px;border:1px solid var(--mist);font-size:.93rem}
.act-meta>div{padding:12px 14px;border-left:1px solid var(--mist)} .act-meta>div:first-child{border-left:0}
.act-meta dt{font-family:var(--cond);font-weight:600;font-size:1.02rem;color:var(--slate);margin-bottom:4px}
.act-meta dd{margin:0} .act-meta ul{padding-left:1.1em;margin:0}
@media (max-width:700px){ .act-meta{grid-template-columns:1fr} .act-meta>div{border-left:0;border-top:1px solid var(--mist)} .act-meta>div:first-child{border-top:0} .overview,.activity{padding:18px 16px} }

.step{border-top:1px solid var(--mist)}
.step:last-child{border-bottom:1px solid var(--mist)}
.step>summary{cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;padding:14px 4px}
.step>summary::-webkit-details-marker{display:none}
.step>summary::after{content:'+';margin-left:auto;font-family:var(--cond);font-size:1.6rem;line-height:1;color:var(--action)}
.step[open]>summary::after{content:'–'}
.step-no{font-family:var(--cond);font-weight:700;font-size:1.05rem;color:var(--steel);min-width:4.2em}
.step-title{font-family:var(--cond);font-weight:600;font-size:1.35rem}
.step-body{padding:2px 4px 24px}

.instruction{background:var(--tint);border-left:5px solid var(--mast);padding:14px 16px;margin:4px 0 16px}
.instruction p{margin:0;font-weight:500}
.task-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:.8rem;font-weight:600;background:#fff;border:1px solid var(--steel);color:var(--slate);padding:1px 8px}

/* notes */
.note{border:1px solid var(--mist);border-left:5px solid var(--c,var(--explain));background:#fff;padding:12px 16px;margin:16px 0}
.note-explain,.note-note{--c:var(--explain)} .note-provisional{--c:#9A6B00;background:#FFFBEF} .note-ai{--c:#5B4A9E;background:#F6F4FC} .note-model{--c:var(--worked)} .note-worked{--c:var(--worked)} .note-branch{--c:var(--branch)} .note-voices{--c:var(--voices)} .note-resist{--c:var(--resist)} .note-expect{--c:var(--expect)} .note-options{--c:var(--options)}
.note-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.note-kind{font-family:var(--cond);font-weight:700;font-size:1.02rem;color:var(--c)}
.note-title{font-weight:600}
.note-body>:last-child{margin-bottom:0}
details.note>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline}
details.note>summary::-webkit-details-marker{display:none}
details.note>summary .note-head{margin:0}
.note-toggle{margin-left:auto;font-family:var(--cond);font-weight:600;color:var(--action)}
details.note[open] .note-toggle{visibility:hidden}
details.note[open]>summary{margin-bottom:8px}

.legend ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
.legend li{display:flex;align-items:center;gap:8px;font-size:.93rem}
.swatch{width:14px;height:22px;background:var(--c)}

.quote{margin:12px 0;padding:0}
.quote blockquote{margin:0;padding:12px 16px;background:var(--fog);font-size:.96rem}
.quote blockquote p:last-child{margin:0}
.quote figcaption{font-size:.85rem;color:var(--slate);padding:6px 16px 0}
.sub{border:1px solid var(--mist);margin:10px 0;background:#fff}
.sub>summary{cursor:pointer;padding:10px 14px;font-family:var(--cond);font-weight:600;font-size:1.15rem}
.sub[open]>summary{border-bottom:1px solid var(--mist)}
.sub-body{padding:6px 14px 14px}
.source{border:1px solid var(--mist);border-left:5px solid var(--slate);padding:12px 16px;margin:12px 0;background:#fff}
.source-title{font-family:var(--cond);font-weight:600;font-size:1.15rem;margin-bottom:4px}
.source-cite{font-size:.92rem;margin-bottom:4px}
.email{white-space:pre-wrap;font-family:var(--sans);font-size:.95rem;background:var(--fog);padding:12px 14px;margin:6px 0 0}

/* tables */
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{border:1px solid var(--mist);padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--mist);font-family:var(--cond);font-weight:600;font-size:1rem}
tbody th{font-weight:500;background:#FBFCFD}
table.grid{min-width:560px}
table.grid td{padding:5px}
table.grid textarea{border-color:var(--mist);min-height:3.2em}
table.grid textarea:focus{border-color:var(--steel)}
tr.group th{background:var(--fog);font-family:var(--cond);font-weight:600;font-size:1rem}
.cell-check{display:flex;justify-content:center;padding-top:6px}
.cell-mark{display:flex;flex-direction:column;gap:4px}
.grid-block{margin:16px 0}
.grid-block>.btn{margin-top:8px}
table.rank .rank-cell{width:72px;text-align:center}
table.rate td.rate-cell{text-align:center;vertical-align:middle}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{margin:0 0 2px}

.checkbox-block{margin:18px 0;padding:12px 16px;border:1px dashed var(--steel);background:#fff}
.checkbox-block.selfcheck{border-style:solid;border-color:var(--mist);border-left:5px solid var(--expect)}
.checks-label{font-family:var(--cond);font-weight:700;font-size:1.05rem;color:var(--expect);margin-bottom:8px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.checks input{margin-top:4px;flex:none}

.match{margin:16px 0}
.match-options{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:var(--fog);padding:12px 14px;margin:0 0 12px}
.match-options dt{font-family:var(--cond);font-weight:700}
.match-options dd{margin:0}
.match-items{padding-left:0;list-style:none}
.match-items li{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--mist);padding:6px 0}

.reveal{margin:16px 0}
.btn-reveal{border-color:var(--worked);color:var(--worked)}
.reveal-prompt{border-left:5px solid var(--branch);background:#FBF7EF;padding:10px 14px;margin-top:8px}
.reveal-prompt p{margin:0}
.reveal-panel{border:1px solid var(--mist);border-top:3px solid var(--worked);padding:12px 16px;margin-top:8px}
.reveal-panel>div>:last-child{margin-bottom:0}
.score{font-weight:700;font-family:var(--cond);font-size:1.2rem}

.portfolio{border-top:4px solid var(--action)}
.export-again{margin-top:18px}

/* module-to-module navigation */
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:0 0 28px}
.pager a{flex:1 1 200px;background:var(--paper);border:1px solid var(--mist);border-top:4px solid var(--action);padding:12px 16px;text-decoration:none;color:var(--ink)}
.pager a:hover{background:var(--tint)}
.pager small{display:block;font-family:var(--cond);font-weight:600;font-size:.98rem;color:var(--action)}
.pager .next{text-align:right}

/* charts, media, provisional */
.bars{margin:14px 0;border:1px solid var(--mist);background:#fff;padding:14px 16px}
.bars-title{font-family:var(--cond);font-weight:600;font-size:1.15rem;margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:.9rem;padding:4px 0;border-top:1px solid var(--fog)}
.bar-row:first-of-type{border-top:0}
.bar-track{background:var(--fog);height:14px}
.bar-fill{background:var(--action);height:14px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:600px){.bar-row{grid-template-columns:minmax(0,1fr) 3.2em}.bar-track{grid-column:1/-1;grid-row:2}}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.profile{border:1px solid var(--mist);border-top:4px solid var(--action);background:#fff;padding:12px 14px}
.profile h4{font-family:var(--cond);font-weight:600;font-size:1.2rem;margin:0 0 4px}
.profile p{margin:0;font-size:.94rem}
.placeholder{border:2px dashed #C9A227;background:#FFFBEF;padding:14px 16px;margin:12px 0;font-size:.95rem}

/* footer */
.foot{background:var(--mast);color:var(--mast-soft);font-size:.9rem}
.foot-inner{max-width:1240px;margin:0 auto;padding:30px 24px 36px}
.foot a{color:#fff}
.foot-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start;padding:18px 0;border-top:1px solid rgba(255,255,255,.16)}
.foot-row:first-child{border-top:0;padding-top:0}
.foot-row img{display:block;width:100%;height:auto;max-width:150px}
.foot-row.eu{grid-template-columns:230px minmax(0,1fr);align-items:center}
.foot-row.eu img{max-width:230px}
.foot-row p{margin:0 0 .6em} .foot-row p:last-child{margin:0}
@media (max-width:700px){.foot-row,.foot-row.eu{grid-template-columns:1fr;gap:12px}.foot-row img{max-width:120px}.foot-row.eu img{max-width:210px}}
.foot .small{color:var(--mast-soft)}
.foot summary{cursor:pointer;font-weight:600;margin-bottom:6px}
.authors{columns:2;font-size:.88rem} @media (max-width:600px){.authors{columns:1}}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{
  body{background:#fff;font-size:11pt}
  .side,.btn,.reveal>.btn,.reveal-prompt,.foot-row img{filter:invert(1)}
  .reveal-panel[hidden]{display:none}
  .layout{display:block;padding:0}
  .overview,.activity{border:0;padding:0;break-before:page}
  .masthead,.foot{background:#fff;color:#000}
  .mod-num{color:#999}
}
.skip{position:absolute;left:-9999px;top:8px;background:#fff;color:var(--ink);padding:8px 12px;z-index:10}
.skip:focus{left:8px}

/* landing page */
.home-intro{background:var(--paper);border:1px solid var(--mist);padding:26px 28px;margin-bottom:28px}
.home-intro h2{font-size:2.1rem;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:28px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--mist);border-top:10px solid var(--cc);text-decoration:none;color:var(--ink);padding:18px 20px 20px}
.card:hover{box-shadow:0 2px 0 var(--cc) inset, 0 6px 18px rgba(30,43,56,.10)}
.card-num{font-family:var(--cond);font-weight:700;font-size:3.4rem;line-height:.9;color:var(--cc)}
.card h3{font-size:1.55rem;margin:6px 0 10px}
.card p{font-size:.95rem;margin:0 0 12px}
.card-meta{margin-top:auto;font-size:.88rem;color:var(--slate)}
.card-go{font-family:var(--cond);font-weight:600;font-size:1.08rem;color:var(--cc);margin-top:10px}
.card.c1{--cc:#1C6E68}.card.c2{--cc:#6A3E8E}.card.c3{--cc:#2A5C8F}.card.c4{--cc:#2F6B3C}.card.c5{--cc:#8E3350}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.refs{list-style:none;padding:0;margin:0 0 1em}
.refs li{padding-left:2em;text-indent:-2em;margin-bottom:.6em;font-size:.95rem}
.sub-h{font-size:1.3rem;margin:20px 0 6px}
.act-no{color:var(--action)}
.btn:hover{background:var(--tint)}
.quiz{margin:14px 0}
.quiz-q{border:1px solid var(--mist);background:#fff;margin:0 0 10px;padding:10px 14px 12px}
.quiz-q legend{font-weight:600;padding:0;display:flex;gap:8px;float:left;width:100%;margin:0 0 6px}
.quiz-opts{clear:both}
.quiz-n{font-family:var(--cond);font-weight:700;color:var(--action)}
.quiz-opts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.quiz-inline .quiz-opts{flex-direction:row;gap:18px}
.quiz-opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.quiz-opt input{margin-top:4px;flex:none}
.mindmap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;align-items:stretch}
.mindmap .centre{grid-column:2;grid-row:2;background:var(--mast);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--cond);font-weight:600;font-size:1.15rem;padding:14px}
.mindmap .node{border:2px solid var(--action);background:var(--tint);padding:10px 12px;text-align:center;font-size:.93rem}
.mindmap .node strong{display:block;font-family:var(--cond);font-size:1.1rem}

 modules:[

  {n:2,file:'module2.html',title:'Locating relevant knowledge to inform language education',activities:5,

  {n:5,file:'module5.html',title:'Alternative ways of reading research in language education',activities:3,
